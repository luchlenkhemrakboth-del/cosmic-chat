<script>
    const socket = io();
    let currentUser = "";
    let activeRoom = "Global Server";
    let localStream = null;

    function joinNetwork() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) return alert('Enter a valid handle!');

      currentUser = username;
      document.getElementById('user-display-name').innerText = username;
      document.getElementById('user-avatar').innerText = username.charAt(0).toUpperCase();

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      socket.emit('user-joined', { username: currentUser, room: activeRoom });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    }

    function switchChat(roomName) {
      activeRoom = roomName;
      document.getElementById('current-chat-title').innerText = roomName;
      document.getElementById('messages-area').innerHTML = '';

      // Highlight active room item
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      const activeEl = Array.from(document.querySelectorAll('.chat-item')).find(el => el.innerText.includes(roomName));
      if (activeEl) activeEl.classList.add('active');

      // Tell backend to join new room room socket
      socket.emit('join-room', roomName);
      closeSidebar();
    }

    function createPrivateRoom() {
      const roomCode = prompt("Enter a Private Room Code or Name:");
      if (!roomCode) return;

      const fullRoomName = `Room: ${roomCode}`;
      const chatList = document.getElementById('chat-list');

      // Avoid creating duplicates in UI list
      const existing = Array.from(chatList.children).find(item => item.innerText.includes(fullRoomName));
      if (!existing) {
        const roomItem = document.createElement('div');
        roomItem.className = 'chat-item';
        roomItem.onclick = () => switchChat(fullRoomName);
        roomItem.innerHTML = `<span>🔒 ${fullRoomName}</span><small style="color:var(--text-sub)">Private</small>`;
        chatList.appendChild(roomItem);
      }

      switchChat(fullRoomName);
    }

    function joinGlobal() {
      switchChat('Global Server');
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const messageData = {
        sender: currentUser,
        text: text,
        room: activeRoom,
        type: 'text'
      };

      socket.emit('send-message', messageData);
      input.value = '';
    }

    function sendImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const messageData = {
          sender: currentUser,
          image: evt.target.result,
          room: activeRoom,
          type: 'image'
        };
        socket.emit('send-message', messageData);
      };
      reader.readAsDataURL(file);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function renderMessage(data) {
      const area = document.getElementById('messages-area');
      const msgDiv = document.createElement('div');

      const isOutgoing = (data.sender === currentUser);
      msgDiv.className = `msg ${isOutgoing ? 'outgoing' : 'incoming'}`;

      let content = `<span class="sender">${data.sender}</span>`;
      if (data.type === 'text') {
        content += `<div>${data.text}</div>`;
      } else if (data.type === 'image') {
        content += `<img src="${data.image}" alt="Shared Image" />`;
      }

      msgDiv.innerHTML = content;
      area.appendChild(msgDiv);
      area.scrollTop = area.scrollHeight;
    }

    // Handles incoming messages for the active room
    socket.on('receive-message', (data) => {
      if (data.room === activeRoom) {
        renderMessage(data);
      }
    });

    // Loads history when entering a room
    socket.on('load-room-history', (payload) => {
      if (payload.room === activeRoom) {
        document.getElementById('messages-area').innerHTML = '';
        payload.history.forEach(msg => {
          renderMessage(msg);
        });
      }
    });

    socket.on('online-users', (data) => {
      const count = data.count || 1;
      document.getElementById('header-online-count').innerText = `${count} Online`;
      document.getElementById('sidebar-online-status').innerText = `${count} Online`;
    });

    async function startVideoCall() {
      document.getElementById('video-modal').classList.remove('hidden');
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        alert("Camera and Microphone permissions required for video calls.");
        endVideoCall();
      }
    }

    function endVideoCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('video-modal').classList.add('hidden');
    }
  </script>
