<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CosmicChat | Neon Blue Experience</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg-dark: #050814;
      --card-bg: rgba(10, 20, 45, 0.65);
      --neon-blue: #00f3ff;
      --neon-glow: rgba(0, 243, 255, 0.4);
      --accent-blue: #0066ff;
      --text-main: #e0f7fc;
      --text-sub: #7a9bb8;
      --border-glow: rgba(0, 243, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0b1536 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Cosmic Background Particles Simulation */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, var(--neon-blue), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.3;
      z-index: 0;
      pointer-events: none;
    }

    /* Screen Wrappers */
    .screen {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    /* --- LOGIN CARD --- */
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 35px var(--neon-glow);
      border-radius: 20px;
      padding: 40px;
      width: 380px;
      text-align: center;
    }

    .login-card h1 {
      font-size: 2rem;
      color: var(--neon-blue);
      text-shadow: 0 0 12px var(--neon-blue);
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--neon-blue);
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-glow);
      background: rgba(5, 12, 30, 0.8);
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--neon-blue);
      box-shadow: 0 0 10px var(--neon-glow);
    }

    .btn-glow {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent-blue), var(--neon-blue));
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 15px var(--neon-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-glow:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--neon-blue);
    }

    /* --- DASHBOARD LAYOUT --- */
    .app-container {
      width: 95vw;
      height: 90vh;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      display: flex;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.15);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background: rgba(4, 10, 26, 0.8);
      border-right: 1px solid var(--border-glow);
      display: flex;
      flex-direction: column;
    }

    .user-profile {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-glow);
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent-blue), var(--neon-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
      box-shadow: 0 0 10px var(--neon-glow);
    }

    .action-bar {
      padding: 15px;
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-glow);
      background: rgba(0, 243, 255, 0.05);
      color: var(--neon-blue);
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(0, 243, 255, 0.2);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .chat-item {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      transition: 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(0, 243, 255, 0.15);
      border-left: 3px solid var(--neon-blue);
    }

    /* Main Chat Window */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .chat-header {
      padding: 18px 25px;
      border-bottom: 1px solid var(--border-glow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 12, 30, 0.5);
    }

    .chat-header h3 {
      color: var(--neon-blue);
      text-shadow: 0 0 8px var(--neon-glow);
    }

    .messages-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg {
      max-width: 60%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
    }

    .msg.incoming {
      background: rgba(15, 30, 60, 0.8);
      border: 1px solid rgba(0, 243, 255, 0.2);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .msg.outgoing {
      background: linear-gradient(135deg, #0052cc, #00a3cc);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 163, 204, 0.3);
    }

    .msg .sender {
      font-size: 0.75rem;
      color: var(--neon-blue);
      margin-bottom: 4px;
      display: block;
    }

    .msg img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 6px;
      border: 1px solid var(--border-glow);
    }

    /* Input Footer */
    .chat-input-area {
      padding: 15px 25px;
      border-top: 1px solid var(--border-glow);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(5, 12, 30, 0.8);
    }

    .file-btn {
      color: var(--neon-blue);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 8px;
      transition: 0.2s;
    }

    .file-btn:hover {
      color: #fff;
      text-shadow: 0 0 8px var(--neon-blue);
    }

    .chat-input-area input[type="text"] {
      flex: 1;
      padding: 12px 18px;
      border-radius: 25px;
      border: 1px solid var(--border-glow);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      outline: none;
    }

    .btn-send {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: var(--neon-blue);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px var(--neon-glow);
    }

    /* Video Overlay Window */
    .video-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 18, 0.95);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 900px;
      height: 70%;
    }

    .video-frame {
      background: #000;
      border: 2px solid var(--neon-blue);
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 20px var(--neon-glow);
    }

    .video-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-controls {
      margin-top: 25px;
      display: flex;
      gap: 20px;
    }

    .btn-call-action {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-glow);
    }

    .btn-call-action.end {
      background: #ff3366;
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
    }
  </style>
</head>
<body>

  <!-- PAGE 1: LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>COSMIC CHAT</h1>
      <p>Connect across the global neon network</p>
      
      <div class="input-group">
        <label>Your Handle</label>
        <input type="text" id="username-input" placeholder="e.g., Starlight_404" />
      </div>

      <button class="btn-glow" onclick="joinNetwork()">ENTER NETWORK</button>
    </div>
  </div>

  <!-- PAGE 2: MAIN CHAT DASHBOARD -->
  <div id="app-screen" class="screen hidden">
    <div class="app-container">
      
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="user-profile">
          <div class="avatar" id="user-avatar">U</div>
          <div>
            <h4 id="user-display-name">Username</h4>
            <span style="font-size:0.75rem; color:var(--neon-blue);">● Online</span>
          </div>
        </div>

        <div class="action-bar">
          <button class="btn-secondary" onclick="joinGlobal()">Global Feed</button>
          <button class="btn-secondary" onclick="createPrivateRoom()">+ Private Room</button>
        </div>

        <div class="chat-list" id="chat-list">
          <div class="chat-item active" onclick="switchChat('Global Server')">
            <span>🌐 Global Server</span>
            <small style="color:var(--text-sub)">Public</small>
          </div>
        </div>
      </div>

      <!-- Main Window -->
      <div class="main-chat">
        <div class="chat-header">
          <h3 id="current-chat-title">🌐 Global Server</h3>
          <button class="btn-secondary" onclick="startVideoCall()">📹 Video Call</button>
        </div>

        <div class="messages-area" id="messages-area">
          <!-- Messages dynamically render here -->
        </div>

        <div class="chat-input-area">
          <label class="file-btn" title="Send Image">
            📷 <input type="file" id="image-input" accept="image/*" style="display:none;" onchange="sendImage(event)"/>
          </label>
          <input type="text" id="message-input" placeholder="Transmit message..." onkeypress="handleKeyPress(event)"/>
          <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>

        <!-- Video Overlay Modal -->
        <div id="video-modal" class="video-modal hidden">
          <div class="video-grid">
            <div class="video-frame">
              <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="video-frame">
              <video id="remote-video" autoplay playsinline></video>
            </div>
          </div>
          <div class="video-controls">
            <button class="btn-call-action end" onclick="endVideoCall()">📵</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Frontend Engine Logic
    const socket = io(); // Connects to Node.js backend
    let currentUser = "";
    let activeRoom = "Global Server";
    let localStream = null;

    function joinNetwork() {
      const username = document.getElementById('username-input').value.trim();
      if (!username) return alert('Enter a valid handle!');

      currentUser = username;
      document.getElementById('user-display-name').innerText = username;
      document.getElementById('user-avatar').innerText = username.charAt(0).toUpperCase();

      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');

      // Register user with backend
      socket.emit('user-joined', username);
    }

    function switchChat(roomName) {
      activeRoom = roomName;
      document.getElementById('current-chat-title').innerText = roomName;
      document.getElementById('messages-area').innerHTML = ''; // Clear viewport
      socket.emit('join-room', roomName);
    }

    function createPrivateRoom() {
      const roomCode = prompt("Enter a Private Room Code or Name:");
      if (!roomCode) return;

      const chatList = document.getElementById('chat-list');
      const roomItem = document.createElement('div');
      roomItem.className = 'chat-item';
      roomItem.onclick = () => switchChat(`Room: ${roomCode}`);
      roomItem.innerHTML = `<span>🔒 Room: ${roomCode}</span><small style="color:var(--text-sub)">Private</small>`;
      chatList.appendChild(roomItem);

      switchChat(`Room: ${roomCode}`);
    }

    function joinGlobal() {
      switchChat('Global Server');
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      const messageData = {
        sender: currentUser,
        text: text,
        room: activeRoom,
        type: 'text'
      };

      socket.emit('send-message', messageData);
      renderMessage(messageData, true);
      input.value = '';
    }

    function sendImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const messageData = {
          sender: currentUser,
          image: evt.target.result,
          room: activeRoom,
          type: 'image'
        };
        socket.emit('send-message', messageData);
        renderMessage(messageData, true);
      };
      reader.readAsDataURL(file);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function renderMessage(data, isOutgoing = false) {
      const area = document.getElementById('messages-area');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${isOutgoing ? 'outgoing' : 'incoming'}`;

      let content = `<span class="sender">${data.sender}</span>`;
      if (data.type === 'text') {
        content += `<div>${data.text}</div>`;
      } else if (data.type === 'image') {
        content += `<img src="${data.image}" alt="Shared Image" />`;
      }

      msgDiv.innerHTML = content;
      area.appendChild(msgDiv);
      area.scrollTop = area.scrollHeight;
    }

    // Socket Event Listeners
    socket.on('receive-message', (data) => {
      if (data.sender !== currentUser && data.room === activeRoom) {
        renderMessage(data, false);
      }
    });

    // WebRTC Video Call logic
    async function startVideoCall() {
      document.getElementById('video-modal').classList.remove('hidden');
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;
      } catch (err) {
        alert("Camera and Microphone permissions required for video calls.");
        endVideoCall();
      }
    }

    function endVideoCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('video-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
